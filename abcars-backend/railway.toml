# Configuración de deploy para Railway
# https://docs.railway.app/deploy/config-as-code

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
# Un solo comando; Railway solo permite 1 elemento en el array
preDeployCommand = ["sh /app/railway/init-app.sh"]
# Arranque por rol (ABCARS_PROCESS_ROLE en Variables de cada servicio):
#   web (default) → serve | scheduler → schedule:run | queue → queue:work
# Ver railway/start.sh y railway/RAILWAY.md
startCommand = "sh /app/railway/start.sh"
