<!-- Chat Panel -->
<div class="chat-panel" *ngIf="isOpen">
  <!-- Header -->
  <div class="chat-header">
    <span class="chat-header-title">Asistente ABCars</span>
    <button type="button" class="chat-close-btn" (click)="toggleChat()" aria-label="Cerrar chat">
      <svg width="18" height="18" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
      </svg>
    </button>
  </div>

  <!-- Messages -->
  <div class="chat-messages" #messagesContainer>
    <div *ngFor="let msg of messages"
         class="message-row"
         [class.message-row-user]="msg.role === 'user'"
         [class.message-row-assistant]="msg.role === 'assistant'">
      <div class="message-bubble"
           [class.user]="msg.role === 'user'"
           [class.assistant]="msg.role === 'assistant'"
           [innerHTML]="msg.role === 'assistant' ? renderMarkdown(msg.content) : msg.content">
      </div>
    </div>

    <!-- Typing indicator -->
    <div *ngIf="isLoading" class="message-row message-row-assistant">
      <div class="message-bubble assistant typing-indicator">
        <span class="dot"></span>
        <span class="dot"></span>
        <span class="dot"></span>
      </div>
    </div>
  </div>

  <!-- Input area -->
  <div class="chat-input-area">
    <input
      type="text"
      [(ngModel)]="currentMessage"
      (keydown.enter)="sendMessage()"
      placeholder="Escribe tu mensaje..."
      [disabled]="isLoading"
      aria-label="Mensaje para el asistente"
    />
    <button
      type="button"
      (click)="sendMessage()"
      [disabled]="isLoading || !currentMessage.trim()"
      aria-label="Enviar mensaje">
      <svg width="20" height="20" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 12h14M12 5l7 7-7 7"/>
      </svg>
    </button>
  </div>
</div>

<!-- Floating Action Button -->
<button
  type="button"
  class="chat-fab"
  (click)="toggleChat()"
  [attr.aria-expanded]="isOpen"
  aria-label="Abrir asistente de chat">
  <svg *ngIf="!isOpen" width="28" height="28" fill="none" stroke="currentColor" viewBox="0 0 24 24">
    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
      d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z"/>
  </svg>
  <svg *ngIf="isOpen" width="28" height="28" fill="none" stroke="currentColor" viewBox="0 0 24 24">
    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
  </svg>
</button>
