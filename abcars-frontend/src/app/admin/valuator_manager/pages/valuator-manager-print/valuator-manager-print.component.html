<app-overview [overview]="itemOverview" [url_index]="'/admin/valuation_manager'" [hideModules]="true"></app-overview>
<div class="container mx-auto px-4 pt-24">
    <div class="w-full mb-6">
        <h4 class="valuator-print-title">Impresión de Valuación</h4>
        <nav class="valuator-print-breadcrumb" aria-label="breadcrumb">
            <ol class="valuator-print-breadcrumb-list">
                <li class="valuator-print-breadcrumb-item" [routerLink]="['/admin/valuation_manager']">Overview</li>
                <li class="valuator-print-breadcrumb-item valuator-print-breadcrumb-item-active" aria-current="page">Imprimir valuación</li>
            </ol>
        </nav>
    </div>

    <div class="w-full">
        <div class="valuator-print-card">
            <div class="valuator-print-content">
                <div class="valuator-print-drop-container">
                    <div class="valuator-print-instructions">
                        <p class="valuator-print-instruction-text">Puedes imprimir por fecha, por nombre de valuador o por ambos campos,</p>
                        <p class="valuator-print-instruction-text">si pulsas descargar sin info en los campos, se imprimirán todas las valuaciones.</p>
                    </div>
                    
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mt-6">
                        <!-- Fecha de inicio -->
                        <div class="valuator-print-form-field">
                            <label class="valuator-print-label">Fecha de inicio</label>
                            <input 
                                type="date" 
                                #dateValuation
                                (change)="getDateValuation($event)"
                                class="valuator-print-input"
                            >
                        </div>

                        <!-- Fecha fin -->
                        <div class="valuator-print-form-field">
                            <label class="valuator-print-label">Fecha fin</label>
                            <input 
                                type="date" 
                                #dateEndValuation
                                (change)="getDateEndValuation($event)"
                                class="valuator-print-input"
                            >
                        </div>

                        <!-- Nombre del valuador -->
                        <div class="valuator-print-form-field md:col-span-2">
                            <label class="valuator-print-label">Nombre del valuador</label>
                            <select 
                                #inputname
                                (change)="onChange(inputname.value)"
                                class="valuator-print-input"
                            >
                                <option value="">Seleccione el valuador</option>
                                <option *ngFor="let valuator of valuators" [value]="valuator.uuid">
                                    {{ valuator.user_profile.name }} {{ valuator.user_profile.last_name }}
                                </option>
                            </select>
                        </div>
                    </div>

                    <!-- Botón Descargar -->
                    <div class="w-full mt-6 text-center">
                        <a 
                            [href]="generateDownloadUrl()"
                            class="valuator-print-btn valuator-print-btn-primary"
                            target="_blank"
                        >
                            DESCARGAR
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
