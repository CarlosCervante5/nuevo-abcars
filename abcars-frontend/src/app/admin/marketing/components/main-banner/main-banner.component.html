<mat-card class="example-card">
    <mat-card-header>
        <mat-card-title>Cargar imagen del banner principal</mat-card-title>
    </mat-card-header>
    <mat-card-content class="m-5">
        <div class="avatar-edit">
            <label for="main-banner-file" class="drop-container">
                <span class="drop-title">Arrastra la imagen aquí</span>
                o elige un archivo
                <input type="file" id="main-banner-file" accept=".png,.jpg,.jpeg,.webp" (change)="assignImage($event)" />
            </label>
        </div>
    </mat-card-content>
    <mat-card-actions class="mx-auto">
        <button mat-button class="btn abcars-background-color-blue mx-2" (click)="uploadImages()" [disabled]="disabled">Subir</button>
        <button *ngIf="isInBottomSheet" mat-button type="button" class="btn abcars-background-color-black" (click)="close()">Cerrar</button>
        <button *ngIf="!isInBottomSheet" mat-button type="button" class="btn abcars-background-color-black" (click)="goToPanel()">Volver al panel</button>
    </mat-card-actions>
    <mat-card-footer *ngIf="loading">
        <mat-progress-bar mode="indeterminate" class="mt-5"></mat-progress-bar>
    </mat-card-footer>
</mat-card>
