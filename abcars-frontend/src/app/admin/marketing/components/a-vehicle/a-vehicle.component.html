<div class="inv-actions" role="group" aria-label="Acciones del vehículo">
  <button
    type="button"
    class="inv-act inv-act--primary"
    matTooltip="Editar datos e imágenes"
    (click)="openEditSheet(0)"
  >
    <mat-icon aria-hidden="true">edit</mat-icon>
  </button>
  <button
    type="button"
    class="inv-act"
    matTooltip="Gestionar fotos (misma ventana)"
    (click)="openEditSheet(1)"
  >
    <mat-icon aria-hidden="true">photo_library</mat-icon>
  </button>
  <button
    type="button"
    class="inv-act inv-act--consignment"
    [class.inv-act--consignment-active]="isConsignment"
    [disabled]="markingConsignment"
    [matTooltip]="isConsignment ? 'Marcado como consignación' : 'Marcar como consignación'"
    (click)="markAsConsignment()"
  >
    <mat-icon aria-hidden="true">handshake</mat-icon>
  </button>
  <button
    *ngIf="canPushIntelimotorPhotos"
    type="button"
    class="inv-act inv-act--intelimotor"
    [disabled]="pushingIntelimotor"
    matTooltip="Subir fotos de ABCars a Intelimotor"
    (click)="pushPhotosToIntelimotor()"
  >
    <mat-icon aria-hidden="true">cloud_upload</mat-icon>
  </button>
  <button
    type="button"
    class="inv-act inv-act--danger"
    matTooltip="Eliminar vehículo"
    (click)="eliminar(vehicle.uuid)"
  >
    <mat-icon aria-hidden="true">delete</mat-icon>
  </button>
  <span
    class="inv-act-check-wrap"
    matTooltip="Seleccionar para acciones masivas"
  >
    <mat-checkbox
      [(ngModel)]="checked"
      (change)="cardChecked()"
      class="inv-act-check"
    ></mat-checkbox>
  </span>
</div>
