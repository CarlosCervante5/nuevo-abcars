<h2 mat-dialog-title>Nueva orden HyP</h2>
<mat-dialog-content class="body-hyp-dialog-content">
  <p class="text-sm text-slate-600 mb-3">
    Orden independiente (no ligada a valuación ni cita). Describe el trabajo solicitado.
  </p>
  <form [formGroup]="form">
    <mat-form-field appearance="outline" class="w-full">
      <mat-label>Título (opcional)</mat-label>
      <input matInput formControlName="title" maxlength="255" />
    </mat-form-field>
    <mat-form-field appearance="outline" class="w-full">
      <mat-label>Descripción</mat-label>
      <textarea matInput formControlName="description" rows="5"></textarea>
      <mat-hint align="end">{{ form.get('description')?.value?.length || 0 }} / 8000</mat-hint>
      <mat-error *ngIf="form.get('description')?.hasError('required')">La descripción es obligatoria.</mat-error>
      <mat-error *ngIf="form.get('description')?.hasError('minlength')">Mínimo 5 caracteres.</mat-error>
    </mat-form-field>
  </form>
</mat-dialog-content>
<mat-dialog-actions align="end">
  <button mat-button type="button" (click)="cancel()" [disabled]="saving">Cancelar</button>
  <button mat-flat-button color="primary" type="button" (click)="submit()" [disabled]="saving || form.invalid">
    {{ saving ? 'Guardando…' : 'Crear orden' }}
  </button>
</mat-dialog-actions>
