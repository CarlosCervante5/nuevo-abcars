<app-overview [overview]="itemOverview" [url_index]="'/admin/body'" [hideModules]="true"></app-overview>
<div class="container mx-auto px-4 pt-24 pb-16">
  <div class="flex flex-wrap items-center justify-between gap-3 mb-4">
    <div>
      <h4 class="text-xl font-bold text-slate-800">Mis órdenes HyP</h4>
      <nav class="text-sm text-slate-500 mt-1" aria-label="breadcrumb">
        <a routerLink="/admin/body" class="text-amber-700 hover:underline">Overview</a>
        <span class="mx-1">/</span>
        <span class="text-slate-700">Órdenes</span>
      </nav>
    </div>
    <button mat-flat-button color="primary" type="button" (click)="openCreate()">
      <mat-icon>add</mat-icon>
      Nueva orden
    </button>
  </div>

  <div class="mat-elevation-z2 rounded overflow-hidden bg-white adm-mat-table-wrap">
    <div *ngIf="loading" class="p-6 text-center text-slate-600">Cargando…</div>
    <table mat-table [dataSource]="dataSource" class="w-full" *ngIf="!loading">
      <ng-container matColumnDef="index">
        <th mat-header-cell *matHeaderCellDef>#</th>
        <td mat-cell *matCellDef="let row; let i = index">{{ (page - 1) * perPage + i + 1 }}</td>
      </ng-container>
      <ng-container matColumnDef="title">
        <th mat-header-cell *matHeaderCellDef>Título</th>
        <td mat-cell *matCellDef="let row">{{ row.title || '—' }}</td>
      </ng-container>
      <ng-container matColumnDef="description">
        <th mat-header-cell *matHeaderCellDef>Descripción</th>
        <td mat-cell *matCellDef="let row">{{ excerpt(row.description) }}</td>
      </ng-container>
      <ng-container matColumnDef="status">
        <th mat-header-cell *matHeaderCellDef>Estatus</th>
        <td mat-cell *matCellDef="let row">{{ row.status }}</td>
      </ng-container>
      <ng-container matColumnDef="created_at">
        <th mat-header-cell *matHeaderCellDef>Creada</th>
        <td mat-cell *matCellDef="let row">{{ row.created_at || '—' }}</td>
      </ng-container>
      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
      <tr class="mat-row" *matNoDataRow>
        <td class="mat-cell p-6 text-slate-600" [attr.colspan]="displayedColumns.length">
          Aún no tienes órdenes. Pulsa «Nueva orden».
        </td>
      </tr>
    </table>
    <mat-paginator
      *ngIf="!loading && total > 0"
      [length]="total"
      [pageSize]="perPage"
      [pageSizeOptions]="[10, 15, 25, 50]"
      (page)="onPage($event)"
      showFirstLastButtons
    ></mat-paginator>
  </div>
</div>
