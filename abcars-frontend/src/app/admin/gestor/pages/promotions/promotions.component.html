<!-- <app-new-nav></app-new-nav> -->
<app-overview
  *ngIf="!embedInShell"
  [overview]="itemOverview"
  [url_index]="'/admin/gestor'"
  [hideModules]="true"
></app-overview>
<div [ngClass]="embedInShell ? 'container mx-auto px-4 pt-2 pb-8' : 'container mx-auto px-4 pt-24'">
    <div class="w-full mt-5 mb-5">
        <!-- Breadcrumb -->
        <div class="w-full">
            <h4 class="promotions-page-title">Administrar Campañas</h4>
            <nav class="promotions-breadcrumb" aria-label="breadcrumb">
                <ol class="promotions-breadcrumb-list">
                    <li
                      class="promotions-breadcrumb-item"
                      [routerLink]="embedInShell ? ['/admin/administrator'] : ['/admin/gestor/']"
                    >
                      {{ embedInShell ? 'Panel' : 'Overview' }}
                    </li>
                    <li class="promotions-breadcrumb-item promotions-breadcrumb-item-active" aria-current="page">Campañas</li>
                </ol>
                <div class="flex justify-end p-3">
                    <a mat-button (click)="newCampaing()" class="promotions-add-btn">
                        <img src="assets/icons-fontawesome/circle-plus.svg" alt="flecha" width="17px" height="17px"> Agregar Campaña
                    </a>
                </div>
            </nav>
        </div>

        <!-- Cards -->
        <div class="grid grid-cols-1 sm:grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-3 gap-4 mt-2 mb-2">
            <div *ngFor="let campaign of campaigns" class="w-full">
                <mat-card class="promotions-card" id="{{campaign.uuid}}">
                    <div class="flex justify-end mt-2">
                        <button mat-button (click)="deleteCampaign(campaign.uuid)" class="promotions-delete-btn">
                            <img src="assets/icons-fontawesome/x-solid.svg" alt="flecha" width="17px" height="17px">
                        </button>
                    </div>
                    <mat-card-header class="flex justify-between promotions-card-header">
                        <mat-card-title class="promotions-card-title">{{ campaign.name | uppercase }}</mat-card-title>
                        <mat-card-title class="promotions-card-subtitle">
                            <span class="promotions-category">{{ campaign.category | uppercase }}</span>
                        </mat-card-title>
                        <mat-card-title class="promotions-card-subtitle">{{ campaign.begin_date }} al {{campaign.end_date}}</mat-card-title>
                    </mat-card-header>
                    <img mat-card-image [src]="campaign.promo_Path ? campaign.promo_Path : campai(null)" class="promotions-card-image fade-in-image" alt="{{ campaign.name | titlecase }}"> 
                    <mat-card-actions class="promotions-card-actions">
                        <button mat-button (click)="openBottomSheet(campaign.uuid)" class="promotions-action-btn">Agregar promociones</button>
                        <button mat-button (click)="openUpdateOrder( campaign.uuid, campaign.promotions )" class="promotions-action-btn">Ordenar promociones</button>
                    </mat-card-actions>
                </mat-card>
            </div>
        </div>
    </div>
</div>
