<div class="bg-white rounded-t-2xl p-6">
  <h2 class="mb-6 text-xl font-semibold text-gray-900">Agregar nueva promoción</h2>

  <form [formGroup]="form" (ngSubmit)="uploadImagesPromo()" class="space-y-6">
    <div>
      <label for="promo-name" class="block text-sm font-medium text-gray-700 mb-2">Nombre</label>
      <input
        id="promo-name"
        type="text"
        formControlName="name"
        placeholder="Nombre de la promoción"
        minlength="1"
        maxlength="191"
        required
        class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-yellow-500 focus:border-yellow-500 transition-all duration-200"
      />
      <p class="mt-2 text-sm text-gray-500">Escriba el nombre de la promoción.</p>
    </div>

    <div>
      <label for="promo-spec-sheet" class="block text-sm font-medium text-gray-700 mb-2">
        Hoja de especificaciones
      </label>
      <input
        id="promo-spec-sheet"
        type="text"
        formControlName="spec_sheet"
        placeholder="URL o enlace"
        minlength="1"
        maxlength="191"
        required
        class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-yellow-500 focus:border-yellow-500 transition-all duration-200"
      />
      <p class="mt-2 text-sm text-gray-500">Enlace a la hoja de especificaciones.</p>
    </div>

    <div>
      <span class="block text-sm font-medium text-gray-700 mb-2">Imagen de la promoción</span>
      <label for="promo-images-input" class="drop-container">
        <span class="drop-title">Arrastra aquí tus archivos</span>
        <span class="text-center text-sm text-gray-500">o elige desde tu equipo</span>
        <input
          type="file"
          id="promo-images-input"
          accept=".png,.jpg,.jpeg,.webp"
          (change)="assignImagePromo($event)"
          required
        />
      </label>
    </div>

    <div *ngIf="loading" class="pt-2">
      <mat-progress-bar mode="indeterminate"></mat-progress-bar>
    </div>

    <div class="flex flex-col-reverse gap-3 sm:flex-row sm:justify-end sm:items-center">
      <button
        type="button"
        (click)="close()"
        class="w-full sm:w-auto px-4 py-3 rounded-lg border border-gray-300 text-gray-700 font-medium hover:bg-gray-50 transition-all duration-200"
      >
        Cancelar
      </button>
      <button
        type="submit"
        [disabled]="form.invalid || loading"
        class="w-full sm:w-auto bg-yellow-500 hover:bg-yellow-600 text-white font-semibold py-3 px-6 rounded-lg transition-all duration-200 disabled:opacity-50 disabled:cursor-not-allowed"
      >
        Subir
      </button>
    </div>
  </form>
</div>
