<mat-card class="promo-card block overflow-hidden rounded-xl border border-gray-200 bg-white shadow-sm">
  <mat-card-header class="block px-4 pt-4 pb-0">
    <mat-card-title class="text-lg font-semibold text-gray-900">Agregar nueva promoción</mat-card-title>
  </mat-card-header>

  <form [formGroup]="form" (ngSubmit)="uploadImagesPromo()">
    <mat-card-content class="block px-4 py-5 sm:px-6">
      <div class="flex w-full flex-col gap-5">
        <mat-form-field appearance="outline" class="promo-field w-full">
          <mat-label>Nombre</mat-label>
          <input
            matInput
            type="text"
            formControlName="name"
            placeholder="Nombre de la promoción"
            minlength="1"
            maxlength="191"
            required
          />
          <mat-hint>Escriba el nombre de la promoción.</mat-hint>
        </mat-form-field>

        <mat-form-field appearance="outline" class="promo-field w-full">
          <mat-label>Hoja de especificaciones</mat-label>
          <input
            matInput
            type="text"
            formControlName="spec_sheet"
            placeholder="URL o enlace"
            minlength="1"
            maxlength="191"
            required
          />
          <mat-hint>Enlace a la hoja de especificaciones.</mat-hint>
        </mat-form-field>

        <div class="w-full">
          <label for="promo-images-input" class="drop-container">
            <span class="drop-title">Arrastra aquí tus archivos</span>
            <span class="text-center text-sm text-gray-500">o elige desde tu equipo</span>
            <input
              type="file"
              id="promo-images-input"
              accept=".png,.jpg,.jpeg,.webp"
              (change)="assignImagePromo($event)"
              required
            />
          </label>
        </div>
      </div>
    </mat-card-content>

    <div class="flex flex-col gap-3 px-4 pb-4 sm:flex-row sm:justify-center sm:px-6">
      <button mat-flat-button type="submit" class="promo-btn-submit w-full sm:max-w-xs">
        Subir
      </button>
    </div>
  </form>

  <div class="flex justify-end px-4 pb-4 sm:px-6">
    <button mat-stroked-button type="button" class="promo-btn-cancel" (click)="close()">
      Cancelar
    </button>
  </div>

  <mat-card-footer *ngIf="loading" class="block">
    <mat-progress-bar mode="indeterminate"></mat-progress-bar>
  </mat-card-footer>
</mat-card>
