<div class="bg-white rounded-t-2xl p-4 sm:p-6 max-h-[85vh] overflow-y-auto">
  <h2 class="mb-4 text-xl font-semibold text-gray-900">Orden de imágenes de la campaña</h2>

  <div
    cdkDropList
    class="flex flex-col gap-4"
    (cdkDropListDropped)="drop($event)"
  >
    <div
      *ngFor="let image of imagesForSlider; let i = index"
      cdkDrag
      class="update-images-row rounded-xl border border-gray-200 bg-gray-50/80 p-4 shadow-sm"
    >
      <div class="flex flex-col gap-4 lg:flex-row lg:items-stretch lg:gap-6">
        <div
          class="flex shrink-0 items-center justify-center rounded-lg bg-white px-3 py-2 text-sm font-semibold text-gray-700 ring-1 ring-gray-200 lg:w-28"
        >
          Posición {{ i + 1 }}
        </div>

        <div class="min-w-0 flex-1 space-y-2">
          <p class="text-sm text-gray-700">
            <span class="font-medium text-gray-900">Sitio externo:</span>
            {{ image.external_website }}
          </p>
          <p class="break-all text-sm text-gray-600">
            <span class="font-medium text-gray-900">URL:</span>
            {{ image.path }}
          </p>
          <button
            type="button"
            class="inline-flex items-center gap-2 rounded-lg border border-transparent px-2 py-1.5 text-sm font-medium text-red-600 transition-colors hover:bg-red-50"
            (click)="deleteimage(image.uuid, i)"
          >
            <img
              src="assets/icons-fontawesome/trash-solid_negro.svg"
              alt=""
              width="22"
              height="22"
              aria-hidden="true"
            />
            Eliminar imagen
          </button>
        </div>

        <div class="flex shrink-0 justify-center lg:justify-end">
          <img
            class="h-44 w-44 rounded-lg border border-gray-200 object-cover shadow-sm sm:h-52 sm:w-52"
            [src]="image.path"
            [alt]="'Vista previa ' + (i + 1)"
          />
        </div>
      </div>
    </div>
  </div>

  <div class="mt-6 flex justify-center border-t border-gray-100 pt-6">
    <button
      type="button"
      aria-label="Actualizar orden de las imágenes"
      class="w-full rounded-lg bg-yellow-500 px-6 py-3 text-sm font-semibold text-white shadow-sm transition-all duration-200 hover:bg-yellow-600 sm:w-auto sm:min-w-[200px]"
      (click)="changeOrder()"
    >
      Actualizar orden
    </button>
  </div>
</div>
