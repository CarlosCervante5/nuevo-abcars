<div class="container mx-auto px-4">
    <div class="w-full">
        <div class="w-full">
            <div class="w-full mb-2">
                <h2 class="documentation-vehicle-title">Checklist toma seminuevos</h2>
            </div>
        </div>
    </div>
    <!-- Documentation -->

    <ng-container *ngIf="spinner; else elseTemplate">
        <app-sk-cube></app-sk-cube>
    </ng-container>
    <ng-template #elseTemplate>
        <div class="w-full">
        <mat-stepper #stepper>
            <mat-step [stepControl]="takeInformationForm" errorMessage="La información es requerida">
                <form [formGroup]="takeInformationForm">
                    <ng-template matStepLabel>Información de la toma</ng-template>
                    <div class="w-full">
                        <div class="w-full grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4">
                            <div *ngFor="let checkInformation of informationGathering" class="w-full">
                                <div class="w-full">
                                    <div *ngIf="checkInformation.value_type === 'select'" class="documentation-vehicle-form-field">
                                        <label class="documentation-vehicle-label">{{checkInformation.name}}</label>
                                        <select 
                                            [formControlName]="checkInformation.uuid" 
                                            (change)="onSelectChange($event, checkInformation.uuid)" 
                                            required
                                            class="documentation-vehicle-select"
                                            [class.documentation-vehicle-input-error]="takeInformationForm.get(checkInformation.uuid)?.invalid && takeInformationForm.get(checkInformation.uuid)?.touched"
                                        >
                                            <option value="" disabled>Seleccione una opción</option>
                                            <option *ngFor="let value of checkInformation.values" [value]="value">{{ value }}</option>
                                        </select>
                                        <span class="documentation-vehicle-hint" *ngIf="takeInformationForm.get(checkInformation.uuid)?.invalid && takeInformationForm.get(checkInformation.uuid)?.touched">
                                            Por favor seleccione una opción
                                        </span>
                                    </div>

                                    <div *ngIf="checkInformation.value_type === 'number'" class="documentation-vehicle-form-field">
                                        <label class="documentation-vehicle-label">{{ checkInformation.name }}</label>
                                        <input 
                                            type="number" 
                                            [formControlName]="checkInformation.uuid" 
                                            (input)="onInputChange($event, checkInformation.uuid)" 
                                            (focus)="inputFocus = true" 
                                            (blur)="onInputBlur(checkInformation.uuid)"
                                            class="documentation-vehicle-input"
                                        >
                                    </div>
                                </div>
                            </div>
                        </div>

                        <div class="w-full grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4 pb-4">
                            <div *ngFor="let checkInformationT of informationGatheringT; let i = index" class="w-full">
                                <div class="w-full">
                                    <label class="documentation-vehicle-toggle">
                                        <input 
                                            type="checkbox" 
                                            [formControlName]="checkInformationT.uuid" 
                                            (change)="onTenancyChange(checkInformationT.uuid, (year - i), $event)"
                                            class="documentation-vehicle-toggle-input"
                                        >
                                        <span class="documentation-vehicle-toggle-slider"></span>
                                        <span class="documentation-vehicle-toggle-label">{{ year - i }}</span>
                                    </label>
                                </div>
                            </div>
                        </div>
                        
                    </div>
                    
                    <div class="mt-3">
                        <button type="button" matStepperNext class="documentation-vehicle-btn documentation-vehicle-btn-primary mt-3 mx-2 px-3">
                            Siguiente
                        </button>
                    </div>
                </form>
            </mat-step>

            <mat-step [stepControl]="documentationCarForm" errorMessage="La información es requerida">
                <form [formGroup]="documentationCarForm">
                    <ng-template matStepLabel>Documentación de la unidad</ng-template>
                    <div class="w-full">
                        <div class="w-full grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4">
                            <div *ngFor="let checkUnitDocument of unitDocumentation" class="w-full">
                                <div *ngIf="checkUnitDocument.section_name === 'Documentación de la unidad'" class="w-full">
                                    <div class="w-full">
                                        <div *ngIf="checkUnitDocument.value_type === 'select'" class="documentation-vehicle-form-field">
                                            <label class="documentation-vehicle-label">{{ checkUnitDocument.name }}</label>
                                            <select 
                                                [formControlName]="checkUnitDocument.uuid" 
                                                (change)="onSelectChange($event, checkUnitDocument.uuid)" 
                                                required
                                                class="documentation-vehicle-select"
                                                [class.documentation-vehicle-input-error]="documentationCarForm.get(checkUnitDocument.uuid)?.invalid && documentationCarForm.get(checkUnitDocument.uuid)?.touched"
                                            >
                                                <option value="" disabled>Seleccione una opción</option>
                                                <option *ngFor="let valueUnitDocument of checkUnitDocument.values" [value]="valueUnitDocument">{{valueUnitDocument}}</option>
                                            </select>
                                            <span class="documentation-vehicle-hint" *ngIf="documentationCarForm.get(checkUnitDocument.uuid)?.invalid && documentationCarForm.get(checkUnitDocument.uuid)?.touched">
                                                Por favor seleccione una opción.
                                            </span>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                    
                    <div class="mt-3">
                        <button type="button" matStepperPrevious class="documentation-vehicle-btn documentation-vehicle-btn-secondary mt-3 mx-2 px-3">
                            Regresar
                        </button>
                        <button type="button" matStepperNext class="documentation-vehicle-btn documentation-vehicle-btn-primary mt-3 mx-2 px-3">
                            Siguiente
                        </button>
                    </div>
                </form>
            </mat-step>

            <mat-step [stepControl]="documentsPlateProceduresForm" errorMessage="La información es requerida">
                <form [formGroup]="documentsPlateProceduresForm"> <!--(ngSubmit)="onSubmit()"-->
                    <ng-template matStepLabel>Documentos para tramites de placas</ng-template>
                    <div class="w-full">
                        <div class="w-full grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4">
                            <div *ngFor="let checkPlateDocuments of plateDocuments" class="w-full">
                                <div *ngIf="checkPlateDocuments.section_name === 'Fotos' || checkPlateDocuments.section_name === 'Documentos para tramites de placas'" class="w-full">
                                    <div class="w-full">
                                        <div *ngIf="checkPlateDocuments.value_type === 'select'" class="documentation-vehicle-form-field">
                                            <label class="documentation-vehicle-label">{{checkPlateDocuments.name}}</label>
                                            <select 
                                                [formControlName]="checkPlateDocuments.uuid" 
                                                (change)="onSelectChange($event, checkPlateDocuments.uuid)" 
                                                required
                                                class="documentation-vehicle-select"
                                                [class.documentation-vehicle-input-error]="documentsPlateProceduresForm.get(checkPlateDocuments.uuid)?.invalid && documentsPlateProceduresForm.get(checkPlateDocuments.uuid)?.touched"
                                            >
                                                <option value="" disabled>Seleccione una opción</option>
                                                <option *ngFor="let valuePlateDocuments of checkPlateDocuments.values" [value]="valuePlateDocuments">{{valuePlateDocuments}}</option>
                                            </select>
                                            <span class="documentation-vehicle-hint" *ngIf="documentsPlateProceduresForm.get(checkPlateDocuments.uuid)?.invalid && documentsPlateProceduresForm.get(checkPlateDocuments.uuid)?.touched">
                                                Por favor seleccione una opción.
                                            </span>
                                        </div>

                                        <div *ngIf="checkPlateDocuments.value_type === 'textArea'" class="documentation-vehicle-form-field">
                                            <label class="documentation-vehicle-label">{{checkPlateDocuments.name}}</label>
                                            <textarea 
                                                (input)="onInputChange($event, checkPlateDocuments.uuid)" 
                                                (focus)="inputFocus = true" 
                                                (blur)="onTextAreaBlur(checkPlateDocuments.uuid)"
                                                class="documentation-vehicle-textarea"
                                            >{{checkPlateDocuments.selected_value}}</textarea>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>

                    <div class="mt-3">
                        <button type="button" matStepperPrevious class="documentation-vehicle-btn documentation-vehicle-btn-secondary mt-3 mx-2 px-3">
                            Regresar
                        </button>

                        <button type="button" class="documentation-vehicle-btn documentation-vehicle-btn-primary mt-3 mx-2 px-3" (click)="uploadDocumentInput.click()" [disabled]="spinner">
                            <span *ngIf="!spinner">Cargar expediente</span>
                            <span *ngIf="spinner" class="documentation-vehicle-spinner"></span>
                        </button>
                        <input type="file" accept=".pdf" class="hidden" #uploadDocumentInput (change)="uploadDocuments($event)">

                        <a href="{{url}}" target="_blank" class="no-underline">
                            <button *ngIf="btn_watch" type="button" class="documentation-vehicle-btn documentation-vehicle-btn-primary mt-3 mx-2 px-3">
                                Ver Expediente
                            </button>
                        </a>

                        <button type="button" class="documentation-vehicle-btn documentation-vehicle-btn-secondary mt-3 mx-2 px-3" (click)="closeWindow()">
                            Cerrar
                        </button>

                    </div>
                </form>
            </mat-step>

        </mat-stepper>
        </div>
    </ng-template>
</div>
