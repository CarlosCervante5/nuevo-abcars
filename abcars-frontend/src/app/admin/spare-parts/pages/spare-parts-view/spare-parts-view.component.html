<!-- <app-new-nav></app-new-nav> -->
<app-overview [overview]="itemOverview" [url_index]="'/admin/spare_parts'" [hideModules]="true"></app-overview>
<div class="container mx-auto px-4 pt-24">
    <div class="w-full mt-5 mb-5">
        <!-- Header -->
        <div class="mb-3">
            <div class="w-full">
                <h4 class="spare-parts-view-page-title">Visualización de Refacciones</h4>
                <nav class="spare-parts-view-breadcrumb" aria-label="breadcrumb">
                    <ol class="spare-parts-view-breadcrumb-list">
                        <li class="spare-parts-view-breadcrumb-item" [routerLink]="['/admin/spare_parts']">Overview</li>
                        <li class="spare-parts-view-breadcrumb-item" [routerLink]="['/admin/spare_parts/administration']">Refacciones</li>
                        <li class="spare-parts-view-breadcrumb-item spare-parts-view-breadcrumb-item-active" aria-current="page">Visualización de Refacciones</li>
                    </ol>
                </nav>
            </div>
        </div>

        <!-- Table Container -->
        <div class="spare-parts-view-table-container">
            <div class="mat-elevation-z8">
                <table mat-table [dataSource]="dataSource">
                    <ng-container matColumnDef="id">
                        <th mat-header-cell *matHeaderCellDef mat-sort-header>#</th>
                        <td class="font-bold" mat-cell *matCellDef="let row; let i = index">{{ i + 1 }}</td>
                    </ng-container>

                    <ng-container matColumnDef="name">
                        <th mat-header-cell *matHeaderCellDef mat-sort-header>Nombre</th>
                        <td mat-cell *matCellDef="let row"> {{ row.name }} </td>
                    </ng-container>

                    <ng-container matColumnDef="amount">
                        <th mat-header-cell *matHeaderCellDef mat-sort-header>Cantidad</th>
                        <td mat-cell *matCellDef="let row"> {{ row.quantity }} pza(s)</td>
                    </ng-container>

                    <ng-container matColumnDef="hours">
                        <th mat-header-cell *matHeaderCellDef mat-sort-header>Horas</th>
                        <td mat-cell *matCellDef="let row"> {{ row.labor_time }} hr(s)</td>
                    </ng-container>
                    
                    <ng-container matColumnDef="fill">
                        <th mat-header-cell *matHeaderCellDef mat-sort-header>Modificado</th>
                        <td class="font-bold" mat-cell *matCellDef="let row"></td>
                    </ng-container>

                    <ng-container matColumnDef="carVin">
                        <th mat-header-cell *matHeaderCellDef mat-sort-header>Auto vin</th>
                        <td mat-cell *matCellDef="let row"> {{ dataVehicle && dataVehicle.vin ? dataVehicle.vin : '' }} </td>
                    </ng-container>
                    
                    <ng-container matColumnDef="actions">
                        <th mat-header-cell *matHeaderCellDef mat-sort-header>Acciones</th>
                        <td mat-cell *matCellDef="let row">
                            <button mat-button type="button" class="spare-parts-view-action-btn" [matMenuTriggerFor]="menu">
                                Opciones
                            </button>
                            <mat-menu #menu="matMenu">
                                <a mat-menu-item (click)="openSparePartsEdit(row.uuid)">
                                    Editar
                                </a>
                            </mat-menu>
                        </td>
                    </ng-container>

                    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
                    <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
                </table>
            </div>
        </div>

    </div>
</div>
