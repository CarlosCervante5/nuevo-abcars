<div class="bodywork-paint-form-container">
    <div class="w-full mt-3 mb-3">
        <!-- Title -->
        <div class="mb-5">
            <h1 class="bodywork-paint-form-title">Solicitud HyP</h1>
        </div>

        <!-- Section: Agregar costo -->
        <div class="mb-3">
            <h4 class="bodywork-paint-form-section-title">
                <span class="bodywork-paint-form-bold">Agregar costo de reparación HyP</span>
            </h4>
        </div>

        <hr class="bodywork-paint-form-divider">

        <!-- Section: Conceptos solicitados -->
        <div class="w-full">
            <h4 class="bodywork-paint-form-section-title mb-3">
                <span class="bodywork-paint-form-bold">Conceptos HyP Solicitados</span>
            </h4>
            <div class="bodywork-paint-form-list-container">
                <div class="bodywork-paint-form-list">
                    <li class="bodywork-paint-form-list-item" *ngFor="let imageBodyworkPaint of onHoldBodyworksPaints; let i = index">
                        
                        <div class="bodywork-paint-form-item-description">{{ imageBodyworkPaint.description }}</div>
                        
                        <div class="bodywork-paint-form-item-image" (click)="showModal(imageBodyworkPaint.image_path)">
                            <img class="bodywork-paint-form-image" 
                            [src]="imageBodyworkPaint.image_path" alt="Imagen de concepto">
                        </div>
                        
                        <div class="bodywork-paint-form-item-input">
                            <form [formGroup]="bodyworkPaintForm">
                                <div class="bodywork-paint-form-input-wrapper">
                                    <label class="bodywork-paint-form-input-label">Costo: <span class="bodywork-paint-form-cost-display">${{ bodyworkPaintForm.get('cost')?.value | number: '.2-2' }}</span></label>
                                    <input 
                                        type="number" 
                                        class="bodywork-paint-form-input" 
                                        placeholder="$000000" 
                                        min="0" 
                                        max="9999999999" 
                                        formControlName="cost" 
                                        #amount 
                                        maxlength="10"
                                    >
                                </div>
                            </form>
                        </div>

                        <div class="bodywork-paint-form-item-actions"> 
                            <button mat-button type="button" class="bodywork-paint-form-btn bodywork-paint-form-btn-primary" (click)="onSubmit(imageBodyworkPaint.uuid, 'accepted')" [disabled]="spinner">
                                <span *ngIf="!spinner">Solicitar</span>
                                <span *ngIf="spinner" class="bodywork-paint-form-spinner" role="status" aria-hidden="true"></span>
                            </button>
                            <button mat-button type="button" class="bodywork-paint-form-btn bodywork-paint-form-btn-danger" (click)="onSubmit(imageBodyworkPaint.uuid, 'rejected')" [disabled]="spinner">
                                <span *ngIf="!spinner">Rechazar</span>
                                <span *ngIf="spinner" class="bodywork-paint-form-spinner" role="status" aria-hidden="true"></span>
                            </button>
                        </div>

                    </li>
                </div>
            </div>
        </div>

        <!-- Close Button -->
        <div class="flex justify-end mt-5">
            <button mat-button type="button" class="bodywork-paint-form-btn bodywork-paint-form-btn-primary" (click)="closeBottomSheet()">
                Cerrar
            </button>
        </div>

    </div>
</div>
