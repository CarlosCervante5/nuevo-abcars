<app-overview [overview]="itemOverview" [url_index]="'/admin/administrator'" [hideModules]="true"></app-overview>
<div class="min-h-screen bg-gray-50">
  <div class="max-w-4xl mx-auto px-4 sm:px-6 lg:px-8 pt-24 pb-12">
    <div class="bg-white shadow-sm rounded-xl p-6">
      <div class="mb-6">
        <h1 class="text-2xl font-bold text-gray-900">Información de la API</h1>
        <nav class="mt-2 text-sm text-gray-500">
          <a class="text-gray-500 hover:text-gray-700" [routerLink]="['/admin/administrator']">Overview</a>
          <span class="mx-2">/</span>
          <span class="text-gray-700 font-medium">API</span>
        </nav>
      </div>

      <div *ngIf="loading" class="flex justify-center py-12">
        <div class="animate-spin rounded-full h-12 w-12 border-b-2 border-yellow-500"></div>
      </div>

      <div *ngIf="error" class="bg-red-50 border border-red-200 text-red-700 px-4 py-3 rounded-lg">
        {{ error }}
      </div>

      <div *ngIf="apiInfo && !loading" class="space-y-4">
        <div class="p-4 bg-gray-50 rounded-lg">
          <p class="text-sm text-gray-600">Base URL</p>
          <p class="font-mono text-lg font-semibold text-gray-900">{{ baseUrl }}/api</p>
        </div>
        <div class="p-4 bg-gray-50 rounded-lg">
          <p class="text-sm text-gray-600">Estado</p>
          <p class="font-semibold text-green-600">{{ apiInfo['status'] || 'N/A' }}</p>
        </div>
        <div class="p-4 bg-gray-50 rounded-lg">
          <p class="text-sm text-gray-600">Documentación completa</p>
          <a [href]="baseUrl + '/api-docs'" target="_blank" rel="noopener"
            class="text-yellow-600 hover:text-yellow-700 font-medium">{{ apiInfo['documentation'] || baseUrl + '/api-docs' }}</a>
        </div>
      </div>
    </div>
  </div>
</div>
