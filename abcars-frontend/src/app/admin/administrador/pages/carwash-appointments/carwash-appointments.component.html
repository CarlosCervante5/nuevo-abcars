<div class="cw-root adm-shell-page">
  <div class="cw-hero">
    <div class="cw-hero-text">
      <p class="cw-eyebrow">Agenda</p>
      <h1>Nueva cita de lavado</h1>
      <p>Registra un servicio desde el panel administrador.</p>
    </div>
  </div>

  <form class="cw-panel" (ngSubmit)="submit()">
    <div class="cw-form-grid">
      <label class="cw-field">
        <span>Sede</span>
        <select [(ngModel)]="form.location_uuid" name="location_uuid" required>
          <option *ngFor="let loc of locations" [value]="loc.uuid">{{ loc.name }}</option>
        </select>
      </label>

      <label class="cw-field">
        <span>Servicio</span>
        <select [(ngModel)]="form.service_type_uuid" name="service_type_uuid" required>
          <option *ngFor="let s of services" [value]="s.uuid">
            {{ s.name }} · {{ s.duration_minutes }} min · ${{ s.price }}
          </option>
        </select>
      </label>

      <label class="cw-field">
        <span>Cliente</span>
        <input [(ngModel)]="form.customer_name" name="customer_name" required />
      </label>

      <label class="cw-field">
        <span>Teléfono WhatsApp</span>
        <input [(ngModel)]="form.customer_phone" name="customer_phone" required placeholder="+52155..." />
      </label>

      <label class="cw-field">
        <span>Inicio</span>
        <input type="datetime-local" [(ngModel)]="form.scheduled_start_at" name="scheduled_start_at" required />
      </label>

      <label class="cw-field">
        <span>Placas</span>
        <input [(ngModel)]="form.vehicle_plates" name="vehicle_plates" />
      </label>

      <label class="cw-field">
        <span>Marca</span>
        <input [(ngModel)]="form.vehicle_brand" name="vehicle_brand" />
      </label>

      <label class="cw-field">
        <span>Modelo</span>
        <input [(ngModel)]="form.vehicle_model" name="vehicle_model" />
      </label>

      <label class="cw-field">
        <span>Color</span>
        <input [(ngModel)]="form.vehicle_color" name="vehicle_color" />
      </label>

      <label class="cw-field cw-field--full">
        <span>Notas</span>
        <textarea rows="3" [(ngModel)]="form.notes" name="notes"></textarea>
      </label>
    </div>

    <div class="cw-form-footer">
      <button class="cw-btn cw-btn--primary" type="submit" [disabled]="saving">
        {{ saving ? 'Guardando…' : 'Crear cita' }}
      </button>
    </div>
  </form>

  <p class="cw-alert cw-alert--ok" *ngIf="success">{{ success }}</p>
  <p class="cw-alert cw-alert--error" *ngIf="error">{{ error }}</p>
</div>
