<app-overview [overview]="itemOverview" [url_index]="'/admin/administrator'" [hideModules]="true"></app-overview>
<div class="min-h-screen bg-gray-50">
  <div class="max-w-7xl mx-auto px-6 lg:px-8 pt-24 pb-12">
    <div class="bg-white shadow-sm rounded-xl p-6">
      <div class="flex flex-col gap-3 sm:flex-row sm:items-center sm:justify-between mb-6">
        <div>
          <h1 class="text-2xl font-bold text-gray-900">Roles y permisos</h1>
          <nav class="mt-2 text-sm text-gray-500" aria-label="breadcrumb">
            <ol class="flex flex-wrap items-center gap-2">
              <li><a class="text-gray-500 hover:text-gray-700" [routerLink]="['/admin/administrator']">Overview</a></li>
              <li class="text-gray-400">/</li>
              <li class="text-gray-700 font-medium" aria-current="page">Roles y permisos</li>
            </ol>
          </nav>
        </div>
      </div>

      <div *ngIf="loading" class="flex justify-center py-12">
        <app-sk-cube></app-sk-cube>
      </div>

      <div *ngIf="!loading" class="flex flex-col lg:flex-row gap-6">
        <!-- Lista de roles -->
        <div class="lg:w-1/3">
          <h2 class="text-lg font-semibold text-gray-900 mb-3">Roles</h2>
          <div class="space-y-2 max-h-96 overflow-y-auto">
            <button
              *ngFor="let role of roles"
              type="button"
              (click)="selectRole(role)"
              [class.bg-amber-50]="selectedRole?.id === role.id"
              [class.border-amber-500]="selectedRole?.id === role.id"
              class="w-full text-left px-4 py-3 rounded-lg border transition-all hover:bg-gray-50"
            >
              <span class="font-medium text-gray-900">{{ role.name }}</span>
            </button>
          </div>
        </div>

        <!-- Permisos del rol seleccionado -->
        <div class="lg:flex-1" *ngIf="selectedRole">
          <div class="flex items-center justify-between mb-4">
            <h2 class="text-lg font-semibold text-gray-900">Permisos de {{ selectedRole.name }}</h2>
            <div class="flex gap-2">
              <button
                type="button"
                (click)="savePermissions()"
                [disabled]="saving"
                class="px-4 py-2 bg-amber-500 text-white rounded-lg hover:bg-amber-600 disabled:opacity-50"
              >
                {{ saving ? 'Guardando...' : 'Guardar cambios' }}
              </button>
              <button
                type="button"
                (click)="clearSelection()"
                class="px-4 py-2 bg-gray-200 text-gray-700 rounded-lg hover:bg-gray-300"
              >
                Cerrar
              </button>
            </div>
          </div>
          <div class="grid grid-cols-1 sm:grid-cols-2 gap-2 max-h-96 overflow-y-auto">
            <label
              *ngFor="let perm of permissions"
              class="flex items-center gap-2 p-3 rounded-lg border cursor-pointer hover:bg-gray-50"
            >
              <input
                type="checkbox"
                [checked]="hasPermission(perm.name)"
                (change)="togglePermission(perm.name)"
                class="rounded border-gray-300 text-amber-500 focus:ring-amber-500"
              >
              <span class="text-sm text-gray-700">{{ perm.name }}</span>
            </label>
          </div>
        </div>

        <div *ngIf="!selectedRole && !loading" class="lg:flex-1 flex items-center justify-center text-gray-500">
          <p>Selecciona un rol para editar sus permisos</p>
        </div>
      </div>
    </div>
  </div>
</div>
