<div class="min-h-screen bg-gray-50">
  <div class="max-w-5xl mx-auto px-4 sm:px-6 lg:px-8 py-10">
    <div class="bg-white shadow-sm rounded-xl p-6 sm:p-8">
      <div class="text-center mb-6">
        <h1 class="text-2xl sm:text-3xl font-bold text-gray-900">Editar Usuario</h1>
        <p class="text-gray-600 mt-2">Por favor, edite los campos que deseados...</p>
        <div class="mt-4 border-t border-gray-200"></div>
      </div>

      <ng-container *ngIf="spinner; else elseTemplate">
        <app-sk-cube></app-sk-cube>
      </ng-container>
      <ng-template #elseTemplate>
        <form [formGroup]="form" (ngSubmit)="onSubmit()"> 
          <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
            <div class="w-full">
              <label class="block text-sm font-medium text-gray-700 mb-2">Nombre(s)</label>
              <input
                type="text"
                placeholder="Alfredo"
                formControlName="name"
                class="w-full px-3 py-2 border border-gray-300 rounded-md focus:ring-2 focus:ring-yellow-500 focus:border-yellow-500 bg-white text-sm"
              >
              <p *ngIf="nameInvalid" class="text-xs text-red-600 mt-1">Ingrese un nombre válido.</p>
            </div>

            <div class="w-full">
              <label class="block text-sm font-medium text-gray-700 mb-2">Apellidos(s)</label>
              <input
                type="text"
                placeholder="Ortega"
                formControlName="last_name"
                class="w-full px-3 py-2 border border-gray-300 rounded-md focus:ring-2 focus:ring-yellow-500 focus:border-yellow-500 bg-white text-sm"
              >
              <p *ngIf="last_nameInvalid" class="text-xs text-red-600 mt-1">Ingrese apellidos válidos.</p>
            </div>

            <div class="w-full">
              <label class="block text-sm font-medium text-gray-700 mb-2">Género</label>
              <select
                formControlName="gender"
                class="w-full px-3 py-2 border border-gray-300 rounded-md focus:ring-2 focus:ring-yellow-500 focus:border-yellow-500 bg-white text-sm"
              >
                <option value="" disabled>Seleccione</option>
                <option value="M">Femenino</option>
                <option value="H">Masculino</option>
              </select>
              <p *ngIf="genderInvalid" class="text-xs text-red-600 mt-1">Seleccione un género válido.</p>
            </div>

            <div class="w-full">
              <label class="block text-sm font-medium text-gray-700 mb-2">Email</label>
              <input
                type="email"
                placeholder="example@gmail.com"
                formControlName="email"
                class="w-full px-3 py-2 border border-gray-300 rounded-md focus:ring-2 focus:ring-yellow-500 focus:border-yellow-500 bg-white text-sm"
              >
              <p *ngIf="emailInvalid" class="text-xs text-red-600 mt-1">Ingrese un email válido.</p>
            </div>

            <div class="w-full">
              <label class="block text-sm font-medium text-gray-700 mb-2">Teléfono Principal</label>
              <input
                type="tel"
                placeholder="1234567890"
                formControlName="phone_1"
                class="w-full px-3 py-2 border border-gray-300 rounded-md focus:ring-2 focus:ring-yellow-500 focus:border-yellow-500 bg-white text-sm"
              >
              <p *ngIf="phoneOneInvalid" class="text-xs text-red-600 mt-1">Ingrese un número telefónico válido.</p>
            </div>

            <div class="w-full">
              <label class="block text-sm font-medium text-gray-700 mb-2">Teléfono Secundario</label>
              <input
                type="tel"
                placeholder="1234567890"
                formControlName="phone_2"
                class="w-full px-3 py-2 border border-gray-300 rounded-md focus:ring-2 focus:ring-yellow-500 focus:border-yellow-500 bg-white text-sm"
              >
              <p *ngIf="phoneTwoInvalid" class="text-xs text-red-600 mt-1">Ingrese un número telefónico válido.</p>
            </div>

            <div class="w-full">
              <label class="block text-sm font-medium text-gray-700 mb-2">Sucursal</label>
              <select
                formControlName="location"
                class="w-full px-3 py-2 border border-gray-300 rounded-md focus:ring-2 focus:ring-yellow-500 focus:border-yellow-500 bg-white text-sm"
              >
                <option value="" disabled>Seleccione</option>
                <option *ngFor="let location of filteredLocation | async" [value]="location.name">
                  {{ location.name }}
                </option>
              </select>
            </div>

            <div class="w-full">
              <label class="block text-sm font-medium text-gray-700 mb-2">Rol</label>
              <select
                formControlName="role_name"
                class="w-full px-3 py-2 border border-gray-300 rounded-md focus:ring-2 focus:ring-yellow-500 focus:border-yellow-500 bg-white text-sm"
              >
                <option value="" disabled>Seleccione</option>
                <option *ngFor="let rol of filteredRoles | async" [value]="rol.name">
                  {{ rol.name }}
                </option>
              </select>
            </div>

            <div class="w-full">
              <label class="block text-sm font-medium text-gray-700 mb-2">Password</label>
              <input
                type="text"
                placeholder="*****"
                formControlName="password"
                class="w-full px-3 py-2 border border-gray-300 rounded-md focus:ring-2 focus:ring-yellow-500 focus:border-yellow-500 bg-white text-sm"
              >
              <p *ngIf="passwordInvalid" class="text-xs text-red-600 mt-1">Escribe la contraseña del usuario.</p>
            </div>
          </div>

          <div class="mt-6">
            <h3 class="text-base font-semibold text-gray-900 mb-3">Foto de perfil</h3>
            <div class="flex flex-col sm:flex-row gap-6 items-start">
              <div class="w-full sm:w-1/3 flex justify-center">
                <img [src]="foto || 'assets/img/user.jpeg'" (error)="onImageError()" alt="Foto de perfil" class="h-40 w-40 rounded-lg object-cover border border-gray-200">
              </div>
              <label for="picture" class="drop-container w-full sm:w-2/3">
                <span class="drop-title">Drop files here</span>
                or
                <input type="file" id="picture" (change)="assignImagePromo($event)" accept=".png, .jpg, .jpeg, .webp" required> 
              </label>
            </div>
          </div>

          <div class="mt-8 flex flex-col sm:flex-row sm:justify-end gap-3">
            <button
              type="submit"
              class="px-6 py-2 rounded-md text-white bg-blue-600 hover:bg-blue-700 disabled:opacity-60 disabled:cursor-not-allowed"
              [disabled]="spinner"
            >
              Actualizar
            </button>
            <button
              type="button"
              class="px-6 py-2 rounded-md text-gray-700 bg-gray-200 hover:bg-gray-300"
              (click)="close()"
            >
              Cancelar
            </button>
          </div>
        </form>
      </ng-template>
    </div>
  </div>
</div>
